; Supervisor — worker de colas AnitaERP (Laravel database driver)
; Instalar: deploy/queue/aplicar-supervisor.sh

[program:anitaERP-queue]
process_name=%(program_name)s_%(process_num)02d
; max-time escalonado por process_num (±2 min) para no reiniciar los 3 workers a la vez
command=/bin/bash -c 'exec /usr/bin/php /var/www/html/anitaERP/artisan queue:work database --sleep=3 --tries=3 --timeout=360 --max-time=$((3720 + %(process_num)s * 120))'
directory=/var/www/html/anitaERP
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/html/anitaERP/storage/logs/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
