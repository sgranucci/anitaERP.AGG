; Supervisor — worker dedicado padrones IIBB (CABA/ARBA), prioridad baja
; Instalar: deploy/queue/aplicar-supervisor.sh
; TIMEOUT 7200 + QUEUE_RETRY_AFTER >= 7500

[program:anitaERP-queue-padrones]
process_name=%(program_name)s
command=/bin/bash -c 'exec nice -n 19 ionice -c3 /usr/bin/php /var/www/html/anitaERP/artisan queue:work database --queue=padrones --sleep=5 --tries=1 --timeout=7200 --max-time=14400'
directory=/var/www/html/anitaERP
autostart=true
autorestart=true
stopwaitsecs=7200
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/anitaERP/storage/logs/queue-padrones-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
