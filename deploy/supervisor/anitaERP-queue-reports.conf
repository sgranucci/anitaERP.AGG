; Supervisor — colas dedicadas reportes sueldos (Laravel database driver)
; Instalar junto a anitaERP-queue.conf vía deploy/queue/aplicar-supervisor.sh

[program:anitaERP-queue-reports]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/anitaERP/artisan queue:work database --queue=reports --sleep=3 --tries=3 --timeout=1900 --max-time=3600
directory=/var/www/html/anitaERP
autostart=true
autorestart=true
stopwaitsecs=1900
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/anitaERP/storage/logs/queue-reports-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:anitaERP-queue-reports-mail]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/anitaERP/artisan queue:work database --queue=reports-mail --sleep=3 --tries=3 --timeout=1900 --max-time=3600
directory=/var/www/html/anitaERP
autostart=true
autorestart=true
stopwaitsecs=1900
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/anitaERP/storage/logs/queue-reports-mail-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
