# Virtual host HTTPS — ipelbierzo / 192.168.59.122 (bie-svrv-sis2)
#
# Requiere certificado CA interna (ver aplicar-vhost-ipelbierzo-ssl.sh):
#   /etc/ssl/anitaERP/ipelbierzo-fullchain.pem
#   /etc/ssl/anitaERP/ipelbierzo-privkey.pem
#
# URL canónica: https://ipelbierzo/ventas/...  (sin /anitaERP/public)
# Bookmarks legacy (http://ipelbierzo:12280/anitaERP/public/...) → 301 automático
#
# .env tras aplicar:
#   APP_URL=https://ipelbierzo
#   APP_CARPETA=
#   EMPRESA_LINK=/
#   SESSION_SECURE_COOKIE=true

# ── HTTP :80 — redirige a HTTPS ──
<VirtualHost *:80>
	ServerName ipelbierzo
	ServerAlias 192.168.59.122 anitaERP bie-svrv-sis2

	ServerAdmin sergiogranucci@gmail.com

	<IfModule mod_rewrite.c>
		RewriteEngine On
		# APIs legacy: redirect explícito (integraciones POST deben usar HTTPS directo)
		RewriteRule ^/anitaERP/public/api/(.*)$ https://ipelbierzo/api/$1 [R=301,L]
		RewriteRule ^/anitaERP/public/?(.*)$ https://ipelbierzo/$1 [R=301,L]
		RewriteRule ^/anitaERP/?(.*)$ https://ipelbierzo/$1 [R=301,L]
		RewriteRule ^/(.*)$ https://ipelbierzo/$1 [R=301,L]
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-access.log combined
</VirtualHost>

# ── HTTP :12280 — bookmarks con puerto (mismo destino HTTPS) ──
<VirtualHost *:12280>
	ServerName ipelbierzo
	ServerAlias 192.168.59.122 anitaERP bie-svrv-sis2

	ServerAdmin sergiogranucci@gmail.com

	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteRule ^/anitaERP/public/api/(.*)$ https://ipelbierzo/api/$1 [R=301,L]
		RewriteRule ^/anitaERP/public/?(.*)$ https://ipelbierzo/$1 [R=301,L]
		RewriteRule ^/anitaERP/?(.*)$ https://ipelbierzo/$1 [R=301,L]
		RewriteRule ^/(.*)$ https://ipelbierzo/$1 [R=301,L]
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-12280-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-12280-access.log combined
</VirtualHost>

# ── HTTPS :443 — aplicación ──
<VirtualHost *:443>
	ServerName ipelbierzo
	ServerAlias 192.168.59.122

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	Timeout 600

	SetEnv ANITAERP_ENTORNO production
	SetEnv ANITAERP_SERVIDOR 192.168.59.122

	SSLEngine on
	SSLCertificateFile      /etc/ssl/anitaERP/ipelbierzo-fullchain.pem
	SSLCertificateKeyFile   /etc/ssl/anitaERP/ipelbierzo-privkey.pem

	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder off

	<Directory /var/www/html/anitaERP/public>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	# Acceso por IP en :443 → nombre canónico
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteCond %{HTTP_HOST} ^192\.168\.59\.122$ [NC]
		RewriteRule ^ https://ipelbierzo%{REQUEST_URI} [R=301,L]
	</IfModule>

	# Legacy por si llega directo a :443
	RedirectMatch 301 ^/anitaERP/public/?(.*)$ https://ipelbierzo/$1

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-ipelbierzo-ssl-access.log combined

	<IfModule mod_headers.c>
		Header always set X-AnitaERP-Entorno "production"
		Header always set X-AnitaERP-Servidor "192.168.59.122"
		# Activar HSTS cuando el entorno esté estable (2–4 semanas):
		# Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
	</IfModule>
</VirtualHost>
