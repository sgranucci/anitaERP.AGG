# Virtual host TEST con HTTPS — 10.20.30.211
#
# Requiere:
#   1) DNS interno: anitaerp-test.agg.com → 10.20.30.211
#   2) Certificado en /etc/letsencrypt/live/anitaerp-test.agg.com/ (ver README-HTTPS.md)
#
# HTTP :80  → redirige todo a HTTPS (misma ruta)
# HTTPS :443 → Laravel en DocumentRoot public/
# Rutas legacy /anitaERP/public/* → redirigen a la raíz HTTPS

<VirtualHost *:80>
	ServerName anitaerp-test.agg.com
	ServerAlias 10.20.30.211

	# Certbot HTTP-01 (solo si el dominio es alcanzable desde internet en :80)
	DocumentRoot /var/www/html/anitaERP/public
	<Directory /var/www/html/anitaERP/public>
		Require all granted
	</Directory>

	# Tras obtener el certificado, descomentar la línea siguiente y comentar el bloque
	# "RedirectMatch legacy" de abajo si solo querés forzar HTTPS:
	# Redirect permanent / https://anitaerp-test.agg.com/

	# Mientras tanto: legacy HTTP sigue funcionando; estas reglas preparan el corte
	RedirectMatch 301 ^/anitaERP/public/?(.*)$ http://anitaerp-test.agg.com/$1

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-test-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-test-access.log combined
</VirtualHost>

<VirtualHost *:443>
	ServerName anitaerp-test.agg.com

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	Timeout 600

	SetEnv ANITAERP_ENTORNO test
	SetEnv ANITAERP_SERVIDOR 10.20.30.211

	SSLEngine on
	SSLCertificateFile      /etc/letsencrypt/live/anitaerp-test.agg.com/fullchain.pem
	SSLCertificateKeyFile   /etc/letsencrypt/live/anitaerp-test.agg.com/privkey.pem
	# Opcional (Let's Encrypt ya incluye cadena en fullchain.pem):
	# SSLCertificateChainFile /etc/letsencrypt/live/anitaerp-test.agg.com/chain.pem

	# TLS moderno (Debian 12 / OpenSSL 3)
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder off

	<Directory /var/www/html/anitaERP/public>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	# URLs viejas con subdirectorio → raíz limpia
	RedirectMatch 301 ^/anitaERP/public/?(.*)$ https://anitaerp-test.agg.com/$1

	# Acceso por IP al :443 (opcional): redirigir al nombre canónico
	# RewriteEngine On
	# RewriteCond %{HTTP_HOST} ^10\.20\.30\.211$ [NC]
	# RewriteRule ^ https://anitaerp-test.agg.com%{REQUEST_URI} [R=301,L]

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-test-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-test-ssl-access.log combined

	<IfModule mod_headers.c>
		Header always set X-AnitaERP-Entorno "test"
		Header always set X-AnitaERP-Servidor "10.20.30.211"
		Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
	</IfModule>
</VirtualHost>
