# HTTPS de prueba por IP — 10.20.30.210
#
# Solo :443. No toca HTTP.
# DocumentRoot = /var/www/html  → misma URL que hoy:
#   https://10.20.30.210/anitaERP/public/...
#
# No redirige HTTP→HTTPS.
# No reescribe /anitaERP/public.
# No cambiar APP_URL ni APP_CARPETA.

<VirtualHost *:443>
	ServerName 10.20.30.210
	ServerAlias anitaERP

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html

	Timeout 1200

	SetEnv ANITAERP_ENTORNO production
	SetEnv ANITAERP_SERVIDOR 10.20.30.210
	SetEnv ANITAERP_HTTPS_PRUEBA ip-210

	SSLEngine on
	SSLCertificateFile      /etc/ssl/anitaERP/ip-210/cert.pem
	SSLCertificateKeyFile   /etc/ssl/anitaERP/ip-210/privkey.pem
	SSLProtocol             -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder     off

	<Directory /var/www/html>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	<Directory /var/www/html/anitaERP/public>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-prod-ssl-ip-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-prod-ssl-ip-access.log combined

	<IfModule mod_headers.c>
		Header always set X-AnitaERP-Entorno "production"
		Header always set X-AnitaERP-Servidor "10.20.30.210"
		Header always set X-AnitaERP-Https-Prueba "ip-210"
	</IfModule>
</VirtualHost>
