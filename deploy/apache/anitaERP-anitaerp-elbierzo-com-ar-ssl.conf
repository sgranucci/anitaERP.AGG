# Virtual host HTTPS — anitaerp.elbierzo.com.ar (El Bierzo / bie-svrv-sis2)
#
# URL canónica: https://anitaerp.elbierzo.com.ar/
# Legacy: http://ip.elbierzo.com.ar:12280/anitaERP/public/... → 301 a HTTPS
#         http://anita.elbierzo.com.ar/... → 301 a HTTPS (subdominio anterior)
#
# Certificados (Let's Encrypt tras certbot):
#   /etc/letsencrypt/live/anitaerp.elbierzo.com.ar/fullchain.pem
#   /etc/letsencrypt/live/anitaerp.elbierzo.com.ar/privkey.pem
#
# Guía: deploy/apache/README-HTTPS-EL-BIERZO.md
# Aplicar: deploy/apache/aplicar-vhost-anitaerp-elbierzo-com-ar-ssl.sh

# ── HTTP :80 — redirect a HTTPS (dejar DocumentRoot para ACME si hace falta) ──
<VirtualHost *:80>
	ServerName anitaerp.elbierzo.com.ar
	ServerAlias anita.elbierzo.com.ar ip.elbierzo.com.ar 192.168.59.122 anitaERP bie-svrv-sis2 ipelbierzo

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	<Directory /var/www/html/anitaERP/public>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# Renovación Let's Encrypt (webroot) — no redirigir .well-known
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteRule ^/\.well-known/acme-challenge/ - [L]
		RewriteRule ^/anitaERP/public/api/(.*)$ https://anitaerp.elbierzo.com.ar/api/$1 [R=301,L]
		RewriteRule ^/anitaERP/public/?(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
		RewriteRule ^/anitaERP/?(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
		RewriteRule ^/(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-http-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-http-access.log combined
</VirtualHost>

# ── HTTP :12280 — bookmarks viejos (mismo destino HTTPS) ──
<VirtualHost *:12280>
	ServerName anitaerp.elbierzo.com.ar
	ServerAlias anita.elbierzo.com.ar ip.elbierzo.com.ar 192.168.59.122 anitaERP bie-svrv-sis2 ipelbierzo

	ServerAdmin sergiogranucci@gmail.com

	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteRule ^/anitaERP/public/api/(.*)$ https://anitaerp.elbierzo.com.ar/api/$1 [R=301,L]
		RewriteRule ^/anitaERP/public/?(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
		RewriteRule ^/anitaERP/?(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
		RewriteRule ^/(.*)$ https://anitaerp.elbierzo.com.ar/$1 [R=301,L]
	</IfModule>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-12280-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-12280-access.log combined
</VirtualHost>

# ── HTTPS :443 — aplicación ──
<VirtualHost *:443>
	ServerName anitaerp.elbierzo.com.ar
	ServerAlias anita.elbierzo.com.ar ip.elbierzo.com.ar 192.168.59.122

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	Timeout 600

	SetEnv ANITAERP_ENTORNO production
	SetEnv ANITAERP_SERVIDOR 192.168.59.122

	SSLEngine on
	SSLCertificateFile      /etc/letsencrypt/live/anitaerp.elbierzo.com.ar/fullchain.pem
	SSLCertificateKeyFile   /etc/letsencrypt/live/anitaerp.elbierzo.com.ar/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder off

	<Directory /var/www/html/anitaERP/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Acceso por IP o hostname legacy en :443 → nombre canónico
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteCond %{HTTP_HOST} ^(192\.168\.59\.122|ip\.elbierzo\.com\.ar|anita\.elbierzo\.com\.ar)(:443)?$ [NC]
		RewriteRule ^ https://anitaerp.elbierzo.com.ar%{REQUEST_URI} [R=301,L]
	</IfModule>

	# Legacy path aunque llegue directo a :443
	RedirectMatch 301 ^/anitaERP/public/?(.*)$ https://anitaerp.elbierzo.com.ar/$1

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-ssl-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-elbierzo-ssl-access.log combined

	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
		Header always set Referrer-Policy "strict-origin-when-cross-origin"
		Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
		Header always set X-AnitaERP-Entorno "production"
		Header always set X-AnitaERP-Servidor "192.168.59.122"
		# Activar HSTS cuando esté estable 2–4 semanas (después descomentar):
		# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	</IfModule>
</VirtualHost>
