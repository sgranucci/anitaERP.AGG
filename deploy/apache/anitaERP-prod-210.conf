# Virtual host PRODUCCIÓN — 10.20.30.210 (no instalar en .211).
# URL canónica: http://10.20.30.210/  (sin /anitaERP/public).
<VirtualHost *:80>
	ServerName 10.20.30.210

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	Timeout 600

	# Redirect legacy: /anitaERP/public/* y /anitaERP/* → raíz del sitio
	<IfModule mod_rewrite.c>
		RewriteEngine On
		RewriteRule ^/anitaERP/public/?(.*)$ /$1 [R=301,L]
		RewriteRule ^/anitaERP/?(.*)$ /$1 [R=301,L]
	</IfModule>

	SetEnv ANITAERP_ENTORNO production
	SetEnv ANITAERP_SERVIDOR 10.20.30.210

	<Directory /var/www/html/anitaERP/public>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-prod-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-prod-access.log combined

	<IfModule mod_headers.c>
		Header always set X-AnitaERP-Entorno "production"
		Header always set X-AnitaERP-Servidor "10.20.30.210"
	</IfModule>
</VirtualHost>
