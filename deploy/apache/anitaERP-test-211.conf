# Virtual host TEST — solo 10.20.30.211 (no usar en .210 producción).
# ServerName por IP: evita cruce con producción si alguien resuelve "anitaERP" al .210.
<VirtualHost *:80>
	ServerName 10.20.30.211

	ServerAdmin sergiogranucci@gmail.com
	DocumentRoot /var/www/html/anitaERP/public

	Timeout 600

	SetEnv ANITAERP_ENTORNO test
	SetEnv ANITAERP_SERVIDOR 10.20.30.211

	<Directory /var/www/html/anitaERP/public>
		Options Indexes FollowSymLinks MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/anitaERP-test-error.log
	CustomLog ${APACHE_LOG_DIR}/anitaERP-test-access.log combined

	<IfModule mod_headers.c>
		Header always set X-AnitaERP-Entorno "test"
		Header always set X-AnitaERP-Servidor "10.20.30.211"
	</IfModule>
</VirtualHost>
