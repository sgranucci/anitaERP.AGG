# Configuración backup anitaERP (sin credenciales).
# Overrides por servidor: deploy/backup/backup.local.conf (no versionar; ver backup.local.conf.example).

DB_NAME="anitaERP"
BACKUP_DIR="/var/www/html/anitaERP/backups"
# Log junto a los dumps: el cron suele correr como sergio y storage/logs es de www-data.
LOG_FILE="/var/www/html/anitaERP/backups/backup-db.log"
RETENTION_DAYS=7
BINLOG_RETENTION_DAYS=7

# Tamaño mínimo del .sql.gz (bytes). 500 KB evita dumps vacíos; AGG (.210) sube esto en backup.local.conf.
MIN_BACKUP_BYTES=500000

# Sync remoto desactivado por defecto. Solo AGG (.210 → .211): backup.local.conf con REMOTE_SYNC_ENABLED=1
REMOTE_SYNC_ENABLED=0
REMOTE_HOST=""
REMOTE_USER=""
REMOTE_DIR=""
REMOTE_SSH_KEY="${HOME}/.ssh/id_rsa"
