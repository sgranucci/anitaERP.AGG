# Configuración backup anitaERP (sin credenciales).
# Copiar a backup.local.conf para overrides locales (no versionar secretos).

DB_NAME="anitaERP"
BACKUP_DIR="/var/www/html/anitaERP/backups"
LOG_FILE="/var/www/html/anitaERP/storage/logs/backup-db.log"
RETENTION_DAYS=7
BINLOG_RETENTION_DAYS=7

# Validación: tamaño mínimo del .sql.gz (bytes). ~50 MB evita dumps vacíos/cortados.
MIN_BACKUP_BYTES=50000000

# Réplica / servidor remoto (.211)
REMOTE_SYNC_ENABLED=1
REMOTE_HOST="10.20.30.211"
REMOTE_USER="sergio"
REMOTE_DIR="/var/www/html/anitaERP/backups"
REMOTE_SSH_KEY="/home/sergio/.ssh/id_rsa"
