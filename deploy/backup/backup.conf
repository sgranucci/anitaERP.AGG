# Configuración backup anitaERP (sin credenciales).
# Overrides por servidor: deploy/backup/backup.local.conf (no versionar; ver backup.local.conf.example).

DB_NAME="anitaERP"
BACKUP_DIR="/var/www/html/anitaERP/backups"
# Log junto a los dumps: el cron suele correr como sergio y storage/logs es de www-data.
LOG_FILE="/var/www/html/anitaERP/backups/backup-db.log"
# 14 días: hasta el 2026-09-20 esto decía 3, pero la retención nunca borró (find no seguía
# el symlink de BACKUP_DIR), así que se habían juntado 121 dumps / 58 GB. Al arreglar el
# find, 3 días dejaba solo 8 dumps, y hoy no hay copia externa: el sync al .211 falla porque
# su /var está al 100%. Con dumps de ~660 MB, 14 días son ~18 GB sobre los 170 GB libres de
# /scan. Bajar esto solo cuando el sync remoto vuelva a funcionar.
RETENTION_DAYS=14
# Alineado con binlog_expire_logs_seconds=604800 (7 días) en MySQL. Si el disco del .210
# se pierde, los binlogs copiados a /scan y al .211 son la ventana PITR real.
BINLOG_RETENTION_DAYS=7

# Tamaño mínimo del .sql.gz (bytes). 500 KB evita dumps vacíos; AGG (.210) sube esto en backup.local.conf.
MIN_BACKUP_BYTES=500000

# Sync remoto desactivado por defecto. Solo AGG (.210 → .211): backup.local.conf con REMOTE_SYNC_ENABLED=1
REMOTE_SYNC_ENABLED=0
REMOTE_HOST=""
REMOTE_USER=""
REMOTE_DIR=""
REMOTE_SSH_KEY="${HOME}/.ssh/id_rsa"
# Copiar archivos binlog.* al remoto (pesados, ~1 GB c/u). En .211 no hacen falta; PITR se hace en .210.
REMOTE_SYNC_BINLOG_FILES=0
