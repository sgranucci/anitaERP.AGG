<!doctype html>
<meta charset="utf-8">
<title>Ingreso de Proveedores</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --stage:#e4e9f1; --chrome:#f6f8fb;
  --ink:#1b2942; --ink-muted:#5b6577; --accent:#2f6fb5; --accent-ink:#ffffff;
  --accent-soft:#e3edfa; --line:#dbe1e8; --ok:#1f8a4c; --warn:#c0392b;
  --dot:#c7cfda; --shadow: 0 18px 40px -22px rgba(27,41,66,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1520; --surface:#141d29; --stage:#0b1119; --chrome:#111927;
    --ink:#e7edf6; --ink-muted:#93a1b4; --accent:#5b9bdb; --accent-ink:#0b1119;
    --accent-soft:#1c2c3d; --line:#26333f; --ok:#3fbd7c; --warn:#e0665a;
    --dot:#334154; --shadow: 0 18px 40px -22px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#141d29; --stage:#0b1119; --chrome:#111927;
  --ink:#e7edf6; --ink-muted:#93a1b4; --accent:#5b9bdb; --accent-ink:#0b1119;
  --accent-soft:#1c2c3d; --line:#26333f; --ok:#3fbd7c; --warn:#e0665a;
  --dot:#334154; --shadow: 0 18px 40px -22px rgba(0,0,0,.6);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:28px 16px;
}
.mono{ font-family:ui-monospace,'SFMono-Regular',monospace; }

.player{
  width:100%; max-width:960px; background:var(--surface);
  border:1px solid var(--line); border-radius:16px; overflow:hidden;
  box-shadow:var(--shadow);
}

.head{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px; border-bottom:1px solid var(--line);
}
.head .brand{ display:flex; align-items:center; gap:10px; }
.head .brand .mark{
  width:30px; height:30px; border-radius:8px; background:var(--accent-soft);
  color:var(--accent); display:flex; align-items:center; justify-content:center;
  font-size:15px;
}
.head .brand .name{ font-weight:600; font-size:.98rem; letter-spacing:.01em; }
.head .brand .sub{ font-size:.72rem; color:var(--ink-muted); }
.head .count{ font-size:.78rem; color:var(--ink-muted); }
.head .count b{ color:var(--ink); }

.track{ height:3px; background:var(--line); position:relative; }
.track .fill{
  position:absolute; inset:0 auto 0 0; width:0%; background:var(--accent);
  transition:width .12s linear;
}

.stage{
  background:var(--stage); padding:26px; min-height:300px;
  display:flex; align-items:center; justify-content:center;
}
.frame{
  background:var(--chrome); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; max-width:100%; box-shadow:0 10px 24px -16px rgba(20,30,50,.35);
  display:flex; flex-direction:column;
}
.frame .bar{
  display:flex; gap:6px; align-items:center; padding:8px 10px;
  border-bottom:1px solid var(--line);
}
.frame .bar i{ width:8px; height:8px; border-radius:50%; background:var(--dot); display:block; }
.frame .imgwrap{
  padding:10px; display:flex; align-items:center; justify-content:center;
  background:var(--surface);
}
.frame img{
  display:block; max-width:min(78vw,820px); max-height:min(46vh,380px);
  width:auto; height:auto; border-radius:2px;
}

.caption{ padding:20px 26px 8px; }
.caption .eyebrow{
  font-family:ui-monospace,monospace; font-size:.72rem; color:var(--accent);
  letter-spacing:.06em; text-transform:uppercase; margin:0 0 6px;
}
.caption h2{
  margin:0 0 8px; font-size:1.22rem; font-weight:700; text-wrap:balance;
}
.caption p{
  margin:0; color:var(--ink-muted); font-size:.94rem; line-height:1.6; max-width:62ch;
}
.caption b{ color:var(--ink); font-weight:600; }

.controls{
  display:flex; align-items:center; gap:14px; padding:16px 22px 20px;
}
button.nav{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none;
}
button.nav:hover{ border-color:var(--accent); color:var(--accent); }
button.play{
  width:40px; height:40px; border-radius:50%; border:none; background:var(--accent);
  color:var(--accent-ink); font-size:15px; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.dots{ display:flex; gap:7px; flex:1; justify-content:center; flex-wrap:wrap; }
.dots button{
  width:9px; height:9px; padding:0; border-radius:50%; border:none;
  background:var(--dot); cursor:pointer;
}
.dots button.active{ background:var(--accent); width:20px; border-radius:5px; }

@media (prefers-reduced-motion: reduce){
  .track .fill{ transition:none; }
}
</style>

<div class="player">
  <div class="head">
    <div class="brand">
      <div class="mark">🛡️</div>
      <div>
        <div class="name">Ingreso de Proveedores</div>
        <div class="sub">Guía paso a paso · Módulo de Seguridad</div>
      </div>
    </div>
    <div class="count">Paso <b id="cur">1</b> / <span id="tot">5</span></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>

  <div class="stage">
    <div class="frame">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="imgwrap"><img id="shot" src="" alt=""></div>
    </div>
  </div>

  <div class="caption">
    <p class="eyebrow" id="eyebrow">Paso 01</p>
    <h2 id="title"></h2>
    <p id="text"></p>
  </div>

  <div class="controls">
    <button class="nav" id="prev" aria-label="Anterior">‹</button>
    <button class="play" id="play" aria-label="Reproducir">▶</button>
    <button class="nav" id="next" aria-label="Siguiente">›</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

const DURATION = 6000;
let idx = 0, playing = false, raf = null, startedAt = 0;

const els = {
  cur: document.getElementById('cur'),
  tot: document.getElementById('tot'),
  fill: document.getElementById('fill'),
  shot: document.getElementById('shot'),
  eyebrow: document.getElementById('eyebrow'),
  title: document.getElementById('title'),
  text: document.getElementById('text'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next'),
  play: document.getElementById('play'),
  dots: document.getElementById('dots'),
};

els.tot.textContent = STEPS.length;

function pad(n){ return String(n).padStart(2,'0'); }

function buildDots(){
  els.dots.innerHTML = '';
  STEPS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Ir al paso ' + (i+1));
    b.addEventListener('click', ()=> goTo(i, true));
    els.dots.appendChild(b);
  });
}

function render(){
  const s = STEPS[idx];
  els.cur.textContent = idx+1;
  els.shot.src = s.img;
  els.eyebrow.textContent = 'Paso ' + pad(idx+1);
  els.title.textContent = s.title;
  els.text.innerHTML = s.text;
  [...els.dots.children].forEach((d,i)=> d.classList.toggle('active', i===idx));
}

function goTo(i, userInitiated){
  idx = (i + STEPS.length) % STEPS.length;
  render();
  if(userInitiated) resetTimer();
}

function stepFill(ts){
  if(!startedAt) startedAt = ts;
  const elapsed = ts - startedAt;
  const pct = Math.min(100, (elapsed/DURATION)*100);
  els.fill.style.width = pct + '%';
  if(playing){
    if(pct >= 100){
      startedAt = 0;
      goTo(idx+1, false);
    }
    raf = requestAnimationFrame(stepFill);
  }
}

function play(){
  playing = true;
  els.play.textContent = '❚❚';
  els.play.setAttribute('aria-label','Pausar');
  startedAt = 0;
  raf = requestAnimationFrame(stepFill);
}
function pause(){
  playing = false;
  els.play.textContent = '▶';
  els.play.setAttribute('aria-label','Reproducir');
  if(raf) cancelAnimationFrame(raf);
  els.fill.style.width = '0%';
}
function resetTimer(){
  if(playing){ pause(); play(); } else { els.fill.style.width = '0%'; }
}

els.prev.addEventListener('click', ()=> goTo(idx-1, true));
els.next.addEventListener('click', ()=> goTo(idx+1, true));
els.play.addEventListener('click', ()=> playing ? pause() : play());

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft'){ goTo(idx-1, true); }
  else if(e.key === 'ArrowRight'){ goTo(idx+1, true); }
  else if(e.key === ' '){ e.preventDefault(); playing ? pause() : play(); }
});

buildDots();
render();
</script>
