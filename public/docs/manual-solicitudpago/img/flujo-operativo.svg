<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#495057"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f4f9fc"/><stop offset="100%" stop-color="#eef2f6"/></linearGradient>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#1F4E79" font-family="Segoe UI,sans-serif" font-size="18" font-weight="600">Circuito operativo  Solicitudes de pago</text>

  <rect x="40" y="80" width="150" height="58" rx="8" fill="#fff" stroke="#17a2b8" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" fill="#17a2b8" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600">Alta SP</text>
  <text x="115" y="122" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Datos + asiento</text>

  <line x1="190" y1="109" x2="230" y2="109" stroke="#495057" marker-end="url(#arr)"/>

  <rect x="230" y="80" width="150" height="58" rx="8" fill="#fff" stroke="#2E75B6" stroke-width="2"/>
  <text x="305" y="105" text-anchor="middle" fill="#2E75B6" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600">Árbol</text>
  <text x="305" y="122" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Aprobaciones</text>

  <line x1="380" y1="109" x2="420" y2="109" stroke="#495057" marker-end="url(#arr)"/>

  <rect x="420" y="80" width="150" height="58" rx="8" fill="#fff" stroke="#28a745" stroke-width="2"/>
