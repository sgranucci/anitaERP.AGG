  <text x="495" y="122" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Lista para pagar</text>

  <line x1="570" y1="109" x2="610" y2="109" stroke="#495057" marker-end="url(#arr)"/>

  <rect x="610" y="80" width="150" height="58" rx="8" fill="#fff" stroke="#343a40" stroke-width="2"/>
  <text x="685" y="105" text-anchor="middle" fill="#343a40" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600">Pagada</text>
  <text x="685" y="122" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">IE / marca pagada</text>

  <rect x="40" y="220" width="200" height="70" rx="8" fill="#fff" stroke="#6f42c1" stroke-width="2"/>
  <text x="140" y="248" text-anchor="middle" fill="#6f42c1" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600">SP madre + cuotas</text>
  <text x="140" y="268" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Plan de vencimientos</text>

  <line x1="240" y1="255" x2="300" y2="255" stroke="#495057" marker-end="url(#arr)"/>

  <rect x="300" y="220" width="200" height="70" rx="8" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
