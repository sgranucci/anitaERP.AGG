  <text x="400" y="268" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Una por cuota generada</text>

  <line x1="500" y1="255" x2="560" y2="255" stroke="#495057" marker-end="url(#arr)"/>

  <rect x="560" y="220" width="220" height="70" rx="8" fill="#fff" stroke="#20c997" stroke-width="2"/>
