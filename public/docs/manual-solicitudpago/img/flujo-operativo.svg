  <text x="670" y="268" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="10">Filtros, familia, exportación</text>

  <text x="480" y="360" text-anchor="middle" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="11">Las hijas siguen el mismo circuito de aprobación y pago; el plan se edita solo en la madre.</text>
