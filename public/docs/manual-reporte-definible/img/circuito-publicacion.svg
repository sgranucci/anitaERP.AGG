<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <rect width="960" height="280" fill="#f8fafc"/>
  <text x="32" y="36" font-family="DejaVu Sans,Arial" font-size="18" fill="#1F4E79" font-weight="700">Publicación inmutable</text>
  <rect x="40" y="70" width="200" height="70" rx="8" fill="#D6EAF8" stroke="#85C1E9"/><text x="70" y="110" font-family="DejaVu Sans,Arial" font-size="13" fill="#1B4F72">Corrida de hoy</text>
  <path d="M250 105 H300" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="306" y="70" width="240" height="70" rx="8" fill="#E8DAEF" stroke="#AF7AC5"/><text x="340" y="100" font-family="DejaVu Sans,Arial" font-size="13" fill="#6C3483">Publicar</text>
  <text x="330" y="122" font-family="DejaVu Sans,Arial" font-size="11" fill="#5D6D7E">filas + hash + notas</text>
  <path d="M556 105 H606" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="612" y="70" width="300" height="70" rx="8" fill="#D5F5E3" stroke="#58D68D"/><text x="650" y="100" font-family="DejaVu Sans,Arial" font-size="13" fill="#196F3D">Reimprimir idéntico</text>
  <text x="640" y="122" font-family="DejaVu Sans,Arial" font-size="11" fill="#5D6D7E">aunque cambie la definición</text>
  <rect x="40" y="180" width="870" height="70" rx="10" fill="#fff" stroke="#ccd6e0"/>
  <text x="60" y="212" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">≠ Publicar versión (estructura). Al re-ejecutar con mismos filtros: aviso coincide / no coincide.</text>
  <text x="60" y="235" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Editar definición no altera lo publicado; muestra impacto (cantidad de publicaciones).</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E75B6"/></marker></defs>
</svg>
