<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <rect width="960" height="240" fill="#f8fafc"/>
  <text x="32" y="36" font-family="DejaVu Sans,Arial" font-size="18" fill="#1F4E79" font-weight="700">Drill-down de la celda</text>
  <rect x="40" y="80" width="180" height="60" rx="8" fill="#D6EAF8" stroke="#85C1E9"/><text x="90" y="115" font-family="DejaVu Sans,Arial" font-size="13" fill="#1B4F72">1. Rubro</text>
  <path d="M230 110 H270" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="276" y="80" width="180" height="60" rx="8" fill="#FCF3CF" stroke="#F4D03F"/><text x="310" y="115" font-family="DejaVu Sans,Arial" font-size="13" fill="#7D6608">2. Cuentas</text>
  <path d="M466 110 H506" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="512" y="80" width="180" height="60" rx="8" fill="#D5F5E3" stroke="#58D68D"/><text x="545" y="115" font-family="DejaVu Sans,Arial" font-size="13" fill="#196F3D">3. Asientos</text>
