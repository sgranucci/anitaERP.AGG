  <rect x="748" y="80" width="180" height="60" rx="8" fill="#E8DAEF" stroke="#AF7AC5"/><text x="770" y="115" font-family="DejaVu Sans,Arial" font-size="13" fill="#6C3483">4. Documento</text>
  <text x="40" y="190" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Siempre lee asientos (no el snapshot). Tope 300 asientos. Mayor plano abre en otra pestaña.</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E75B6"/></marker></defs>
