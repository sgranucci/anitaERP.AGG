<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <rect width="960" height="280" fill="#f8fafc"/>
  <text x="32" y="36" font-family="DejaVu Sans,Arial" font-size="18" fill="#1F4E79" font-weight="700">Distribución automática</text>
  <rect x="40" y="70" width="200" height="70" rx="8" fill="#D6EAF8" stroke="#85C1E9"/><text x="70" y="100" font-family="DejaVu Sans,Arial" font-size="13" fill="#1B4F72">Suscripción</text>
  <text x="55" y="122" font-family="DejaVu Sans,Arial" font-size="11" fill="#5D6D7E">día 5 · 07:00 · mes ant.</text>
  <path d="M250 105 H300" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="306" y="70" width="220" height="70" rx="8" fill="#FCF3CF" stroke="#F4D03F"/><text x="330" y="100" font-family="DejaVu Sans,Arial" font-size="13" fill="#7D6608">Job horario</text>
  <text x="320" y="122" font-family="DejaVu Sans,Arial" font-size="11" fill="#5D6D7E">distribuir-reportes…</text>
  <path d="M536 105 H586" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="592" y="70" width="320" height="70" rx="8" fill="#D5F5E3" stroke="#58D68D"/><text x="640" y="100" font-family="DejaVu Sans,Arial" font-size="13" fill="#196F3D">Mail + PDF/Excel</text>
  <text x="620" y="122" font-family="DejaVu Sans,Arial" font-size="11" fill="#5D6D7E">opcional: publicar resultado</text>
  <text x="40" y="200" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Probar = envío inmediato. Solo si avisos = manda únicamente cuando hay alertas.</text>
  <text x="40" y="230" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Requiere CONTABLE_REPORTE_DEFINIBLE_DISTRIBUCION=true</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2E75B6"/></marker></defs>
</svg>
