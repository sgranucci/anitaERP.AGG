  <text x="44" y="245" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Diseñar = estructura + layouts + IC + alertas + notas + envíos</text>
  <text x="44" y="275" font-family="DejaVu Sans,Arial" font-size="13" fill="#34495E">Ejecutar = filtros → grilla → export / drill / publicar / control Anita</text>
