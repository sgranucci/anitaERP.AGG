<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="920" height="400" fill="#f8fafc"/>
  <text x="40" y="44" font-family="DejaVu Sans,Arial" font-size="20" fill="#1F4E79" font-weight="700">Validación de una operación</text>
  <rect x="40" y="70" width="180" height="60" rx="8" fill="#EBF5FB" stroke="#5DADE2"/>
  <text x="55" y="106" font-family="DejaVu Sans,Arial" font-size="13" fill="#1A5276">Operación + fecha</text>
  <text x="250" y="106" font-family="DejaVu Sans,Arial" font-size="22" fill="#2E75B6">’</text>
  <rect x="290" y="70" width="220" height="60" rx="8" fill="#FEF9E7" stroke="#F7DC6F"/>
  <text x="310" y="106" font-family="DejaVu Sans,Arial" font-size="13" fill="#7D6608">¿fecha d cierre módulo?</text>
  <text x="540" y="90" font-family="DejaVu Sans,Arial" font-size="13" fill="#196F3D">No ’ permite</text>
  <text x="540" y="120" font-family="DejaVu Sans,Arial" font-size="13" fill="#922B21">Sí ’ ¿apertura / permiso?</text>
  <rect x="40" y="180" width="840" height="170" rx="10" fill="#fff" stroke="#ccd6e0"/>
  <text x="60" y="220" font-family="DejaVu Sans,Arial" font-size="14" fill="#34495E">Facturación: valida fecha de jornada cuando existe.</text>
  <text x="60" y="255" font-family="DejaVu Sans,Arial" font-size="14" fill="#34495E">Cierre general + cierre del módulo: gana el tope más reciente.</text>
  <text x="60" y="290" font-family="DejaVu Sans,Arial" font-size="14" fill="#34495E">WSFE/CAE: no aplica este cierre (valida AFIP/ARCA).</text>
</svg>
