<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#495057"/></marker></defs>
  <rect width="760" height="400" fill="#f8f9fa"/>
  <text x="380" y="28" text-anchor="middle" fill="#1F4E79" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600">Transferencia TRCONT  stock y asiento contable</text>
  <rect x="40" y="52" width="130" height="36" rx="6" fill="#17a2b8"/>
  <text x="105" y="74" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="10">Stock ’ Transferencia</text>
  <line x1="170" y1="70" x2="200" y2="70" stroke="#495057" marker-end="url(#a)"/>
  <rect x="200" y="52" width="150" height="36" rx="6" fill="#6c757d"/>
  <text x="275" y="68" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Tipo TRCONT + CC destino</text>
  <text x="275" y="80" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Depósito salida = últ. recep.</text>
  <line x1="350" y1="70" x2="380" y2="70" stroke="#495057" marker-end="url(#a)"/>
  <rect x="380" y="52" width="120" height="36" rx="6" fill="#fd7e14"/>
  <text x="440" y="74" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="10">Transferir</text>
  <line x1="500" y1="70" x2="530" y2="70" stroke="#495057" marker-end="url(#a)"/>
  <rect x="530" y="52" width="190" height="36" rx="6" fill="#dc3545"/>
  <text x="625" y="68" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Mov. salida -S (stock origen)</text>
  <text x="625" y="80" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="8">Sin asiento en -S/-E</text>
  <line x1="625" y1="88" x2="625" y2="118" stroke="#495057" marker-end="url(#a)"/>
  <rect x="520" y="118" width="210" height="40" rx="20" fill="#ffc107"/>
  <text x="625" y="143" text-anchor="middle" fill="#212529" font-family="Segoe UI,sans-serif" font-size="10">¿Requiere aprobación?</text>
  <line x1="520" y1="138" x2="380" y2="178" stroke="#495057" marker-end="url(#a)"/>
  <text x="430" y="162" fill="#28a745" font-size="9">No  inmediata</text>
  <rect x="300" y="178" width="160" height="36" rx="6" fill="#28a745"/>
  <text x="380" y="200" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Mov. entrada -E + asiento TRA</text>
  <line x1="730" y1="138" x2="625" y2="178" stroke="#495057" marker-end="url(#a)"/>
  <text x="690" y="162" fill="#17a2b8" font-size="9">Sí  pendiente</text>
  <rect x="545" y="178" width="160" height="36" rx="6" fill="#17a2b8"/>
  <text x="625" y="194" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Espera aprobación destino</text>
  <text x="625" y="206" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="8">Sin asiento aún</text>
  <line x1="625" y1="214" x2="625" y2="244" stroke="#495057" marker-end="url(#a)"/>
  <rect x="545" y="244" width="160" height="36" rx="6" fill="#28a745"/>
  <text x="625" y="266" text-anchor="middle" fill="#fff" font-family="Segoe UI,sans-serif" font-size="9">Aprobar ’ -E + asiento</text>
  <rect x="40" y="300" width="680" height="80" rx="8" fill="#fff" stroke="#dee2e6"/>
  <text x="60" y="322" fill="#1F4E79" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600">Asiento único (tipo STK, comprobante TRA)</text>
  <text x="60" y="342" fill="#495057" font-family="Segoe UI,sans-serif" font-size="10">DEBE: cuenta gasto del artículo × CC destino (formulario)</text>
  <text x="60" y="358" fill="#495057" font-family="Segoe UI,sans-serif" font-size="10">HABER: cuenta compra del artículo × CC compra del artículo  Importe = cantidad × precio (TITO: prom. 3 recep.; otros: última compra)</text>
  <text x="60" y="374" fill="#6c757d" font-family="Segoe UI,sans-serif" font-size="9">Rechazo: revierte stock en origen; no genera asiento.</text>
</svg>
