name: PostgreSQL lab
# package:discover needs DB-safe Schema checks (QueryException → false) before .env exists.
#
# CI usa el service container de Actions + PHP del runner (setup-php).
# No usa docker compose: en GHA el daemon/compose fallaba a veces en ~1s
# (exit 1 sin llegar a migrate). El compose local sigue en deploy/infra/postgres-lab.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    paths:
      - 'database/migrations/**'
      - 'app/Support/Database/**'
      - 'scripts/postgres-lab-*.php'
      - 'deploy/infra/postgres-lab/**'
      - '.github/workflows/postgres-lab.yml'

concurrency:
  group: postgres-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-smoke:
    name: migrate + smoke (+ seed)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        # Espejo público de la imagen oficial. Docker Hub corta por timeout en GHA.
        image: public.ecr.aws/docker/library/postgres:16-bookworm
        env:
          POSTGRES_DB: anitaerp_pg_lab
          POSTGRES_USER: anitaerp_lab
          POSTGRES_PASSWORD: lab_ci_only_not_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anitaerp_lab -d anitaerp_pg_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      EMPRESA: LAB_PG
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      LOG_CHANNEL: stderr
      CACHE_DRIVER: array
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: anitaerp_pg_lab
      DB_USERNAME: anitaerp_lab
      DB_PASSWORD: lab_ci_only_not_prod
      DB_DATABASE_PROTEGIDA: anitaERP
      POSTGRES_LAB_CON_SEED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pgsql, xml, zip, gd, intl, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar APP_KEY y storage
        run: |
          set -euo pipefail
          echo "APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          mkdir -p \
            storage/framework/sessions \
            storage/framework/views \
            storage/framework/cache \
            storage/logs \
            bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache

      - name: Esperar PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("pgsql:host=127.0.0.1;port=5432;dbname=anitaerp_pg_lab", "anitaerp_lab", "lab_ci_only_not_prod"); exit(0);} catch (Throwable $e) { fwrite(STDERR, $e->getMessage().PHP_EOL); exit(1);}'; then
              echo "PostgreSQL listo"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL no respondió a tiempo" >&2
          exit 1

      - name: Migrate + smoke + seed
        run: |
          set -euo pipefail
          echo "==> migrate --force (EMPRESA=${EMPRESA})"
          php artisan migrate --force

          echo "==> smoke base"
          php scripts/postgres-lab-smoke.php

          if [[ "${POSTGRES_LAB_CON_SEED}" == "1" ]]; then
            echo "==> seed mínimo"
            php scripts/postgres-lab-seed-minimo.php
            echo "==> smoke con seed"
            SMOKE_EXPECT_SEED=1 php scripts/postgres-lab-smoke.php
            echo "==> smoke HTTP login"
            SMOKE_EXPECT_SEED=1 php scripts/postgres-lab-smoke-http.php
          fi

          echo "CI lab PostgreSQL: OK"
